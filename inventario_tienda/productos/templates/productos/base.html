<!-- base.html -->
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Inventario{% endblock %}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body style="background: linear-gradient(to bottom, #5a4bcf 10%, #f0f4ff 30%) no-repeat; min-height: 100vh;">

    <nav class="navbar navbar-expand-lg navbar-dark bg-primary px-4">
        <a class="navbar-brand" href="{% url 'productos:lista_productos' %}"><strong>Inventario</strong></a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" href="{% url 'productos:agregar_producto' %}">Agregar Producto</a></li>
                <li class="nav-item"><a class="nav-link" href="{% url 'productos:stock_tela' %}">Tela Disponible</a></li>
                <li class="nav-item"><a class="nav-link" href="{% url 'productos:agregar_color' %}">Agregar Color</a></li>
                <li class="nav-item"><a class="nav-link" href="{% url 'productos:hacer_pedido' %}">Hacer Pedido</a></li>
                <li class="nav-item"><a class="nav-link" href="{% url 'productos:eliminar_productos' %}">Eliminar Productos</a></li>
            </ul>
        </div>
    </nav>

    <div class="container mt-5 p-4 bg-white rounded shadow">
        {% block content %}{% endblock %}
    </div>

</body>
</html>
